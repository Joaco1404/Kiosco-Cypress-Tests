<!DOCTYPE html>
<html>
    <head>
        <title>Productos - Kiosco</title>
    </head>
<body>
    <h1>Gestión de Productos</h1>

    <div>
        <input type="text" id="P4_NOMBRE" placeholder="Nombre del producto" />
        <input type="number" id="P4_PRECIO" placeholder="Precio" />
        <input type="number" id="P4_STOCK" placeholder="Stock" />
        <button id="btn-guardar" type="button">Guardar</button>
    </div>

    <div id="mensaje-error" style="color: red; display: none;"></div>
    <div id="mensaje-exito" style="color: green; display: none;"></div>

    <table border="1" id="tabla-productos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody>
            <!--Acá se van a agregar los productos-->
        </tbody>
    </table>

    <script>
        document.getElementById('btn-guardar').addEventListener('click', function() {
            const nombre = document.getElementById('P4_NOMBRE').value;
            const precio = document.getElementById('P4_PRECIO').value;
            const stock = document.getElementById('P4_STOCK').value;
            const errorDiv = document.getElementById('mensaje-error');
            const exitoDiv = document.getElementById('mensaje-exito');
            const tbody = document.querySelector('#tabla-productos tbody');

            //Validación de campos vacíos
            if (!nombre || !precio || !stock) {
                errorDiv.innerText = 'El nombre, precio y stock son obligatorios.';
                errorDiv.style.display = 'block';
                exitoDiv.style.display = 'none';
                return;
            }

            //Simulamos validación de duplicado
            const filas = tbody.getElementsByTagName('tr');
            for (let i = 0; i < filas.length; i++) {
                if (filas[i].cells[0].innerText.toLowerCase() === nombre.toLowerCase()) {
                    errorDiv.innerText = 'El producto ya existe.';
                    errorDiv.style.display = 'block';
                    exitoDiv.style.display = 'none';
                    return
                }
            }

            //Si pasa las validaciones, agregamos al producto
            errorDiv.style.display = 'none';
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${nombre}</td><td>${precio}</td><td>${stock}</td>`;
            tbody.appendChild(tr);

            exitoDiv.innerText = "Producto guardado correctamente.";
            exitoDiv.style.display = 'block';

            //Limpiar campos
            document.getElementById('P4_NOMBRE').value = '';
            document.getElementById('P4_PRECIO').value = '';
            document.getElementById('P4_STOCK').value = '';
        })
    </script>
</body>
</html>
